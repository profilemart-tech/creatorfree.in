<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <metadata id="cf-metadata">
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description rdf:about="">
        <dc:title>Timeline Waveform Seamless Pattern Background</dc:title>
        <dc:creator>CreatorsFree.in</dc:creator>
        <dc:rights>© 2026 CreatorsFree.in - All Rights Reserved</dc:rights>
        <dc:identifier>CF-PAT-2026-001</dc:identifier>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <pattern id="timelinePattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Diagonal Thin Lines -->
      <line x1="0" y1="0" x2="100" y2="100" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.08"/>
      <line x1="0" y1="50" x2="50" y2="100" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.08"/>
      <line x1="50" y1="0" x2="100" y2="50" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.08"/>
      
      <!-- Audio Waveform Motifs -->
      <line x1="20" y1="30" x2="20" y2="40" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.1"/>
      <line x1="24" y1="20" x2="24" y2="50" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.1"/>
      <line x1="28" y1="25" x2="28" y2="45" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.1"/>
      <line x1="32" y1="32" x2="32" y2="38" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.1"/>

      <line x1="70" y1="70" x2="70" y2="80" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.1"/>
      <line x1="74" y1="60" x2="74" y2="90" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.1"/>
      <line x1="78" y1="65" x2="78" y2="85" stroke="#3DDC84" stroke-width="1" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#timelinePattern)"/>
</svg>