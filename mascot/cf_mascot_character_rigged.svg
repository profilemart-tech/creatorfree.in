    <circle cx="350" cy="270" r="14" fill="#3DDC84"/>
  </g>
  <g id="Ear_Right">
    <circle cx="650" cy="270" r="28" fill="#E2E8F0" stroke="#111111" stroke-width="4"/>
    <circle cx="650" cy="270" r="14" fill="#3DDC84"/>
  </g>

  <!-- LAYER 3: Head_Front -->
  <g id="Head_Front">
    <path d="M 370 200 C 370 140, 630 140, 630 200 V 300 C 630 380, 370 380, 370 300 Z" fill="#E2E8F0" stroke="#111111" stroke-width="4"/>
  </g>

