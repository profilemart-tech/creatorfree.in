  <!-- LAYER 1: Head_Back -->
  <g id="Head_Back">
    <path d="M 360 220 C 360 120, 640 120, 640 220 V 300 C 640 400, 360 400, 360 300 Z" fill="#1A1A1A"/>
  </g>

  <!-- LAYER 2: Ear_Left & Ear_Right -->
