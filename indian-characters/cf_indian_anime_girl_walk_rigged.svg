  </metadata>

  <!-- LAYER 1: Hair_Braid_Back (Long Braid with Gajra Flowers) -->
  <g id="Hair_Braid_Back">
    <path d="M 520 200 C 620 250 640 450 600 600 C 580 650 560 700 580 750" fill="#1C1917" stroke="#1C1917" stroke-width="24" stroke-linecap="round"/>
    <!-- Gajra Jasmine Flowers -->
    <circle cx="560" cy="280" r="14" fill="#FFFFFF"/>
    <circle cx="580" cy="320" r="14" fill="#FFFFFF"/>
    <circle cx="590" cy="360" r="14" fill="#FFFFFF"/>
  </g>

  <!-- LAYER 2: Head_Base & MaangTikka -->
  <g id="Head_Base">
    <ellipse cx="500" cy="220" rx="90" ry="110" fill="#FCD34D" stroke="#1C1917" stroke-width="4"/>
    <!-- Hair Front Contour -->
    <path d="M 410 180 C 450 140, 550 140, 590 180 C 560 220, 440 220, 410 180 Z" fill="#1C1917"/>
    <!-- Maang Tikka -->
    <circle cx="500" cy="170" r="8" fill="#FACC15"/>
    <line x1="500" y1="130" x2="500" y2="170" stroke="#FACC15" stroke-width="3"/>
  </g>

  <!-- LAYER 3: Anime_Eyes & Bindi -->
  <g id="Anime_Eyes">
    <!-- Red Bindi -->
    <circle cx="500" cy="200" r="6" fill="#DC2626"/>
    <!-- Left Eye -->
    <ellipse cx="455" cy="230" rx="18" ry="24" fill="#FFFFFF" stroke="#1C1917" stroke-width="3"/>
    <ellipse cx="455" cy="230" rx="10" ry="16" fill="#78350F"/>
    <circle cx="452" cy="224" r="5" fill="#FFFFFF"/>
    <path d="M 435 205 Q 460 200 475 210" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Right Eye -->
    <ellipse cx="545" cy="230" rx="18" ry="24" fill="#FFFFFF" stroke="#1C1917" stroke-width="3"/>
    <ellipse cx="545" cy="230" rx="10" ry="16" fill="#78350F"/>
    <circle cx="542" cy="224" r="5" fill="#FFFFFF"/>
    <path d="M 525 210 Q 540 200 565 205" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- LAYER 4: Nose_Mouth -->
  <g id="Nose_Mouth">
    <path d="M 500 245 Q 495 255 500 260" stroke="#1C1917" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 475 285 Q 500 305 525 285" stroke="#DC2626" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- LAYER 5: Torso_Kurti (Teal Kurti + Gold Border Embroidery) -->
  <g id="Torso_Kurti">
    <path d="M 420 330 H 580 L 610 680 H 390 Z" fill="#0D9488" stroke="#1C1917" stroke-width="4"/>
    <!-- Gold Embroidered Neck & Placket -->
    <path d="M 470 330 L 500 420 L 530 330" fill="none" stroke="#FACC15" stroke-width="8"/>
    <rect x="390" y="665" width="220" height="15" fill="#FACC15"/>
  </g>

  <!-- LAYER 6: Dupatta_Drape (Red Dupatta) -->
  <g id="Dupatta_Drape">
    <path d="M 430 330 C 400 450, 420 600, 410 750" stroke="#DC2626" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M 570 330 Q 640 480 620 700" stroke="#DC2626" stroke-width="22" fill="none" stroke-linecap="round"/>
  </g>

  <!-- LAYER 7: Arm_Upper_Left, Arm_Lower_Left, Hand_Left -->
  <g id="Arm_Upper_Left"><rect x="360" y="340" width="50" height="130" rx="20" fill="#0D9488" stroke="#1C1917" stroke-width="4"/></g>
  <g id="Arm_Lower_Left"><rect x="355" y="440" width="45" height="130" rx="18" fill="#FCD34D" stroke="#1C1917" stroke-width="4"/></g>
  <g id="Hand_Left">
    <circle cx="375" cy="580" r="25" fill="#FCD34D" stroke="#1C1917" stroke-width="4"/>
    <circle cx="375" cy="565" r="27" fill="none" stroke="#FACC15" stroke-width="6"/>
  </g>

  <!-- LAYER 8: Arm_Upper_Right, Arm_Lower_Right, Hand_Right_Diya -->
  <g id="Arm_Upper_Right"><rect x="590" y="340" width="50" height="130" rx="20" fill="#0D9488" stroke="#1C1917" stroke-width="4"/></g>
  <g id="Arm_Lower_Right"><rect x="600" y="440" width="45" height="130" rx="18" fill="#FCD34D" stroke="#1C1917" stroke-width="4"/></g>
  <g id="Hand_Right_Diya">
    <circle cx="625" cy="580" r="25" fill="#FCD34D" stroke="#1C1917" stroke-width="4"/>
    <!-- Golden Diya / Lamp -->
    <path d="M 600 570 Q 630 600 660 570 Z" fill="#FACC15" stroke="#1C1917" stroke-width="3"/>
    <ellipse cx="630" cy="555" rx="8" ry="14" fill="#DC2626"/>
  </g>

  <!-- LAYER 9: Leg_Upper_Left, Leg_Lower_Left, Foot_Left -->
  <g id="Leg_Upper_Left"><rect x="420" y="680" width="65" height="180" rx="18" fill="#0D9488" stroke="#1C1917" stroke-width="4"/></g>
  <g id="Leg_Lower_Left"><rect x="425" y="830" width="55" height="180" rx="16" fill="#0D9488" stroke="#1C1917" stroke-width="4"/></g>
  <g id="Foot_Left"><path d="M 390 1000 H 485 V 1040 Z" fill="#FCD34D" stroke="#1C1917" stroke-width="4"/></g>

  <!-- LAYER 10: Leg_Upper_Right, Leg_Lower_Right, Foot_Right -->
  <g id="Leg_Upper_Right"><rect x="515" y="680" width="65" height="180" rx="18" fill="#0D9488" stroke="#1C1917" stroke-width="4"/></g>
  <g id="Leg_Lower_Right"><rect x="520" y="830" width="55" height="180" rx="16" fill="#0D9488" stroke="#1C1917" stroke-width="4"/></g>
  <g id="Foot_Right"><path d="M 515 1000 H 610 V 1040 Z" fill="#FCD34D" stroke="#1C1917" stroke-width="4"/></g>
</svg>