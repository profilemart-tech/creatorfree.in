  <!-- 1. HEAD & HAIR -->
  <g id="Hair_Braid_Back">
    <path d="M 620 200 C 720 250 740 450 700 600" fill="#1C1917" stroke="#1C1917" stroke-width="24" stroke-linecap="round"/>
  </g>
  <g id="Head_Base">
    <ellipse cx="600" cy="220" rx="90" ry="110" fill="#FCD34D" stroke="#1C1917" stroke-width="4"/>
    <path d="M 510 180 C 550 140, 650 140, 690 180 C 660 220, 540 220, 510 180 Z" fill="#1C1917"/>
    <circle cx="600" cy="170" r="8" fill="#FACC15"/>
  </g>

  <!-- 2. EYES & EXPRESSION STATES -->
  <g id="Eyes_Normal">
    <circle cx="600" cy="200" r="6" fill="#DC2626"/>
    <ellipse cx="555" cy="230" rx="18" ry="24" fill="#FFFFFF" stroke="#1C1917" stroke-width="3"/>
    <ellipse cx="555" cy="230" rx="10" ry="16" fill="#78350F"/>
    <ellipse cx="645" cy="230" rx="18" ry="24" fill="#FFFFFF" stroke="#1C1917" stroke-width="3"/>
    <ellipse cx="645" cy="230" rx="10" ry="16" fill="#78350F"/>
  </g>

  <!-- 3. CRYING TEARS LAYER (Toggle On for Crying Scene) -->
  <g id="Expression_Tears_Crying" opacity="1">
    <path d="M 550 250 C 540 280, 540 310, 555 330" stroke="#38BDF8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 640 250 C 630 280, 630 310, 645 330" stroke="#38BDF8" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 4. LIP-SYNC MOUTH STATES (Swap in Animate CC for Speaking) -->
  <g id="Mouth_State_Neutral" opacity="0">
    <line x1="575" y1="285" x2="625" y2="285" stroke="#1C1917" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g id="Mouth_State_Smile_Laugh" opacity="1">
    <path d="M 570 280 Q 600 315 630 280 Z" fill="#DC2626" stroke="#1C1917" stroke-width="4"/>
  </g>
  <g id="Mouth_State_AE_Speak" opacity="0">
    <ellipse cx="600" cy="285" rx="18" ry="22" fill="#1C1917"/>
  </g>
  <g id="Mouth_State_OU_Speak" opacity="0">
    <circle cx="600" cy="285" r="14" fill="#1C1917"/>
  </g>

  <!-- 5. TORSO & DUPATTA -->
  <g id="Torso_Kurti">
    <path d="M 520 330 H 680 L 710 680 H 490 Z" fill="#0D9488" stroke="#1C1917" stroke-width="4"/>
  </g>

  <!-- 6. PROPS & ACCESSORIES (ROTI ROLLING PIN / BELAN & THALI) -->
  <g id="Prop_Roti_Belan" opacity="1">
    <!-- Rolling Board (Chakla) -->
    <ellipse cx="600" cy="720" rx="120" ry="30" fill="#78350F" stroke="#1C1917" stroke-width="4"/>
    <!-- Flattened Roti -->
    <ellipse cx="600" cy="720" rx="80" ry="20" fill="#FEF08A"/>
    <!-- Rolling Pin (Belan) -->
    <rect x="460" y="710" width="280" height="20" rx="10" fill="#B45309" stroke="#1C1917" stroke-width="4"/>
  </g>

  <!-- 7. LEGS STANDING / WALKING / SITTING POSES -->
  <g id="Legs_Standing_Pose" opacity="1">
    <rect x="520" y="680" width="65" height="280" rx="18" fill="#0D9488" stroke="#1C1917" stroke-width="4"/>
    <rect x="615" y="680" width="65" height="280" rx="18" fill="#0D9488" stroke="#1C1917" stroke-width="4"/>
    <path d="M 490 960 H 585 V 1000 Z" fill="#FCD34D" stroke="#1C1917" stroke-width="4"/>
    <path d="M 615 960 H 710 V 1000 Z" fill="#FCD34D" stroke="#1C1917" stroke-width="4"/>
  </g>
</svg>